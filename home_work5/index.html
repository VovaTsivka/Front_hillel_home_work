<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authorization</title>

    <link href="https://fonts.cdnfonts.com/css/cera-round-pro-demo" rel="stylesheet">

    <link rel="stylesheet" href="./styles/style.css">

    <link rel="stylesheet" href="./styles/reset.css">

    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <form action="submit">
        <div class="close-button"><span>✕</span></div>

        <div class="form-title">
            Login | <span class="highlight">Register</span>
        </div>

        <div class="form-content">
            <label for="register" class="info-text">
                Enter your email and password to register.
            </label>

            <input type="text" name="register" placeholder="Username" class="input-field">
            <input type="text" name="register" placeholder="Enter your email address" class="input-field">
            <input type="password" name="register" placeholder="Password" class="input-field">
            <input type="password" name="register" placeholder="Confirm Password" class="input-field">

            <button name="register" class="register-button">Register</button>

            <label for="register with" class="or-label">Or register with</label>

            <div class="social-input">
                <img src="./logo/Google__G__logo.svg.png" alt="Google">
                <input type="text" name="register_google" placeholder="Continue with Google">
            </div>

            <div class="social-input">
                <img src="./logo/facebook-xxl.png" alt="Facebook">
                <input type="text" name="register_facebook" placeholder="Continue with Facebook">
            </div>

            <div class="bottom-bar"></div>
        </div>
    </form>
</body>
</html>
