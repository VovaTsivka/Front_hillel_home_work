<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization</title>
    <link href="https://fonts.cdnfonts.com/css/cera-round-pro-demo" rel="stylesheet">
</head>
<body style="margin:0; height:100vh; display:flex; justify-content:center; align-items:center; background:#f0f0f0; font-family: 'Cera Pro', sans-serif;">
    <form action="submit" style="width:500px; height:650px; background:white; box-shadow:0 0 10px rgba(0,0,0,0.1); border-radius:10px; ">

        <div style="font-size: 20px; color: #46A358;text-align: end; margin: 13px;"><span>✕</span></div>

        <div style="font-size: 30px; text-align: center;margin-bottom: 30px;">
            Login | 
            <span style="color: #46A358;">Register</span>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; font-size: 13px;line-height: 16px;">

             <label for="register" style="margin-bottom: 14px;">
                Enter your email and password to register.
            </label>

            <input type="text" name="register" placeholder="Username" style="width: 290px; height: 40px;margin-bottom: 16px; padding-left: 10px;">

            <input type="text" name="register" placeholder="Enter your email address" style="width: 290px; height: 40px; margin-bottom: 16px; padding-left: 10px;">

            <div>
                <input type="password" name="register" placeholder="Password" style="width: 290px; height: 40px; margin-bottom: 16px; padding-left: 10px;">
            </div>

            <input type="password" name="register" placeholder="Confirm Password" style="width: 290px; height: 40px; margin-bottom: 35px; padding-left: 10px;">

            <button name="register" style="width: 300px; height: 45px; background-color: #46A358; color: white; border-radius: 5px; border: 2px; margin-bottom: 16px; ">
                Register
            </button>

            <label for="register with" style="margin-bottom: 20px;">Or register with</label>

            <div style="position: relative; width: 300px; margin-bottom: 10px;">
                 <img src="./logo/Google__G__logo.svg.png" alt="Google" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px;">
                <input type="text" name="register_google"
                     placeholder="Continue with Google"
                     style="width: 100%; height: 40px; padding-left: 40px; box-sizing: border-box;">
            </div>

            <div style="position: relative; width: 300px; margin-bottom: 30px;">
                <img src="./logo/facebook-xxl.png" alt="Facebook" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 20px; height:  20px;">
                <input type="text" name="register_facebook"
                     placeholder="Continue with Facebook"
                     style="width: 100%; height: 40px; padding-left: 40px; box-sizing: border-box;margin-bottom: 10px;">
            </div>

            <div style="background-color: #46A358; width: 500px; height: 10px;"></div>
        </div>
    </form>
</body>
</html>
